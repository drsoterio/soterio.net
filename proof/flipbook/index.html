<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Flipbook Proofer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a designer's cutting mat. The book sits on the mat; a slim toolbar on top; views switch between flip, all spreads, and print sheets. */
:root {
  --mat: #DCE7DE;          /* self-healing cutting mat, light */
  --mat-line: #C3D4C6;
  --mat-major: #A9C0AE;
  --panel: #F8FBF8;
  --ink: #17201A;
  --muted: #56685B;
  --accent: #FFD21F;       /* Lab-on-a-Book yellow */
  --accent-ink: #151515;
  --page: #FFFFFF;
  --shadow: 0 1px 2px rgba(20, 35, 25, .18), 0 10px 28px rgba(20, 35, 25, .16);
  --warn: #B4401E;
  --display: "Bebas Neue", "Oswald", "Arial Narrow", Impact, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --mat: #163126; --mat-line: #1F4233; --mat-major: #2A5A45; --panel: #0F231A; --ink: #E7F0E9;
  --muted: #9DB5A5; --page: #FFFFFF; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 30px rgba(0,0,0,.45); --warn: #FF8A65; color-scheme: dark } }
:root[data-theme="dark"] {
  --mat: #163126; --mat-line: #1F4233; --mat-major: #2A5A45; --panel: #0F231A; --ink: #E7F0E9;
  --muted: #9DB5A5; --page: #FFFFFF; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 30px rgba(0,0,0,.45); --warn: #FF8A65; color-scheme: dark }

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--mat);
  background-image:
    linear-gradient(var(--mat-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--mat-major) 1px, transparent 1px),
    linear-gradient(var(--mat-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  color: var(--ink); font-family: var(--body); font-size: 15px;
}
.app { height: 100%; display: flex; flex-direction: column; }
.bar {
  background: var(--panel); border-bottom: 1px solid var(--mat-major);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; margin: 0; letter-spacing: .02em; }
.file { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42ch; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 800 13px var(--body); padding: 7px 13px; cursor: pointer; letter-spacing: .02em; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.btn { border: 1.5px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; font: 800 13px var(--body); padding: 7px 14px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-ink); }
button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.toggle { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; }
.toggle input { width: 16px; height: 16px; accent-color: var(--ink); }

.stage { flex: 1; min-height: 0; position: relative; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px; }
.view { height: 100%; }

/* flip view */
.flip { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.book-wrap { position: relative; min-height: 0; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.book { position: relative; display: flex; perspective: 2200px; }
.slot { position: relative; background: transparent; }
.slot canvas, .leaf canvas { display: block; width: 100%; height: 100%; }
.slot.filled { background: var(--page); box-shadow: var(--shadow); }
.slot.left.filled { box-shadow: var(--shadow), inset -14px 0 18px -14px rgba(0,0,0,.25); }
.slot.right.filled { box-shadow: var(--shadow), inset 14px 0 18px -14px rgba(0,0,0,.25); }
.slot .blank { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; border: 1.5px dashed var(--mat-major); }
.gutter-shade { position: absolute; top: 0; bottom: 0; width: 22px; pointer-events: none; }
.slot.left .gutter-shade { right: 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,.10)); }
.slot.right .gutter-shade { left: 0; background: linear-gradient(270deg, transparent, rgba(0,0,0,.10)); }
.leaf { position: absolute; top: 0; transform-style: preserve-3d; transition: transform .62s cubic-bezier(.45,.05,.25,1); z-index: 5; }
.leaf .face { position: absolute; inset: 0; backface-visibility: hidden; background: var(--page); box-shadow: var(--shadow); }
.leaf .back { transform: rotateY(180deg); }
.hit { position: absolute; top: 0; bottom: 0; width: 22%; z-index: 6; cursor: pointer; border: 0; background: transparent; }
.hit.prev { left: 0; cursor: w-resize; } .hit.next { right: 0; cursor: e-resize; }
.labels { display: flex; justify-content: center; gap: 0; margin: 0 auto; max-width: 100%; font-variant-numeric: tabular-nums; }
.labels span { text-align: center; font-weight: 800; font-size: 13px; color: var(--ink); }
.labels small { display: block; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; }
.nav .where { font-family: var(--display); font-size: 26px; line-height: 1; min-width: 8ch; text-align: center; font-variant-numeric: tabular-nums; }
.jump { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.jump input { width: 4.5em; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--panel); color: var(--ink); font: 700 14px var(--body); }
.hint { color: var(--muted); font-size: 12px; text-align: center; }

/* grid views */
.grid { height: 100%; overflow: auto; }
.grid-inner { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 22px 18px; padding-bottom: 24px; }
.card { background: transparent; border: 0; padding: 0; cursor: pointer; color: var(--ink); text-align: left; }
.pair { display: flex; justify-content: center; }
.thumb { position: relative; width: 50%; aspect-ratio: var(--ar); }
.thumb.filled { background: var(--page); box-shadow: var(--shadow); }
.thumb canvas { width: 100%; height: 100%; display: block; }
.thumb .pn { position: absolute; bottom: 4px; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 800 11px var(--body); font-variant-numeric: tabular-nums; }
.thumb.l .pn { left: 4px; } .thumb.r .pn { right: 4px; }
.card .cap { margin-top: 8px; font-weight: 800; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.card .cap em { font-style: normal; font-weight: 600; color: var(--muted); }
.sheets .pair { gap: 10px; }
.sheets .thumb { width: calc(50% - 5px); }
.sheet-tag { font-family: var(--display); font-size: 20px; letter-spacing: .03em; }

.drop {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: color-mix(in srgb, var(--mat) 82%, transparent); border: 4px dashed var(--ink);
  font-family: var(--display); font-size: clamp(28px, 6vw, 56px); color: var(--ink);
}
.notice { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--panel); border: 1.5px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; z-index: 8; max-width: calc(100% - 32px); text-align: center; }
.notice.err { color: var(--warn); border-color: var(--warn); }
.sample-tag { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 2px 9px; font: 800 11px var(--body); letter-spacing: .05em; text-transform: uppercase; }
@media (max-width: 640px) { .brand h1 { font-size: 24px; } .file { max-width: 24ch; } .hide-sm { display: none; } }
@media (prefers-reduced-motion: reduce) { .leaf { transition: none; } }
</style>
</head>
<body>


<div class="app">
  <header class="bar">
    <div class="brand"><h1>Flipbook Proofer</h1><span class="file" id="fileName"><span class="sample-tag">Sample</span> Drop your PDF to replace it</span></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="View">
      <button id="vFlip" aria-pressed="true">Flip</button>
      <button id="vSpreads" aria-pressed="false">All spreads</button>
      <button id="vSheets" aria-pressed="false">Print sheets</button>
    </div>
    <label class="toggle" title="Books open with the cover alone on the right; pages 2 and 3 face each other."><input type="checkbox" id="coverAlone" checked> Cover alone</label>
    <label class="btn primary" for="pick">Open PDF<input id="pick" type="file" accept="application/pdf,.pdf" hidden></label>
  </header>

  <main class="stage" id="stage">
    <div class="notice" id="notice" hidden></div>

    <section class="view flip" id="flipView">
      <div class="book-wrap" id="bookWrap">
        <div class="book" id="book">
          <div class="slot left" id="slotL"><div class="gutter-shade"></div></div>
          <div class="slot right" id="slotR"><div class="gutter-shade"></div></div>
          <button class="hit prev" id="hitPrev" aria-label="Previous spread"></button>
          <button class="hit next" id="hitNext" aria-label="Next spread"></button>
        </div>
      </div>
      <div>
        <div class="labels" id="labels"></div>
        <div class="nav">
          <button class="btn" id="prev">← Previous</button>
          <div class="where" id="where">—</div>
          <button class="btn" id="next">Next →</button>
          <label class="jump hide-sm" for="goto">Go to page <input id="goto" type="number" min="1" inputmode="numeric"></label>
        </div>
        <p class="hint">Arrow keys or click the page edges to turn. Odd pages land on the right, even pages on the left.</p>
      </div>
    </section>

    <section class="view grid" id="spreadsView" hidden><div class="grid-inner" id="spreadsGrid"></div></section>
    <section class="view grid sheets" id="sheetsView" hidden><div class="grid-inner" id="sheetsGrid"></div></section>
  </main>
</div>
<div class="drop" id="drop" hidden>Drop the PDF anywhere</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const pdfjs = window.pdfjsLib;
  if (pdfjs) pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const state = { src: null, pages: 0, aspect: 0.647, coverAlone: true, spread: 0, view: 'flip', name: '', busy: false };
  const cache = new Map();          // key "n@w" -> canvas
  const MAX_CACHE = 80;

  /* ---------- sample book (shown until a PDF is opened) ---------- */
  const sample = {
    pages: 12, aspect: 5.5 / 8.5,
    async draw(n, canvas) {
      const c = canvas.getContext('2d'); const w = canvas.width, h = canvas.height;
      const yellow = '#FFD21F', ink = '#151515';
      c.fillStyle = n === 1 || n === 12 ? yellow : '#fff'; c.fillRect(0, 0, w, h);
      c.fillStyle = ink; c.textAlign = 'center';
      if (n === 1) {
        c.font = `${Math.round(h * .11)}px "Bebas Neue", Impact, sans-serif`; c.fillText('SAMPLE', w / 2, h * .42); c.fillText('BOOK', w / 2, h * .54);
        c.font = `700 ${Math.round(h * .025)}px Nunito, sans-serif`; c.fillText('front cover · page 1', w / 2, h * .62);
      } else if (n === 12) {
        c.font = `${Math.round(h * .06)}px "Bebas Neue", Impact, sans-serif`; c.fillText('BACK COVER', w / 2, h * .5);
      } else {
        c.fillStyle = '#E9EFEA'; c.fillRect(w * .1, h * .1, w * .8, h * .06);
        for (let i = 0; i < 9; i++) { c.fillStyle = '#EEF2EF'; c.fillRect(w * .1, h * (.22 + i * .06), w * (i % 3 === 2 ? .55 : .8), h * .018); }
        c.fillStyle = ink; c.font = `${Math.round(h * .16)}px "Bebas Neue", Impact, sans-serif`; c.fillText(String(n), w / 2, h * .86);
        c.font = `700 ${Math.round(h * .022)}px Nunito, sans-serif`; c.fillStyle = '#56685B';
        c.fillText(n % 2 ? 'right-hand page (odd)' : 'left-hand page (even)', w / 2, h * .92);
      }
    }
  };

  /* ---------- rendering ---------- */
  async function renderPage(n, cssW) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(40, Math.round(cssW * dpr));
    const key = n + '@' + w;
    if (cache.has(key)) { const v = cache.get(key); cache.delete(key); cache.set(key, v); return v; }
    const canvas = document.createElement('canvas');
    if (state.src === sample) {
      canvas.width = w; canvas.height = Math.round(w / sample.aspect);
      await sample.draw(n, canvas);
    } else {
      const page = await state.src.getPage(n);
      const vp1 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: w / vp1.width });
      canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    }
    cache.set(key, canvas);
    while (cache.size > MAX_CACHE) cache.delete(cache.keys().next().value);
    return canvas;
  }
  function copyCanvas(src) {
    const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
    c.getContext('2d').drawImage(src, 0, 0); return c;
  }

  /* ---------- spreads & sheets ---------- */
  function spreads() {
    const n = state.pages, out = [];
    if (!n) return out;
    if (state.coverAlone) {
      out.push([null, 1]);
      for (let p = 2; p <= n; p += 2) out.push([p, p + 1 <= n ? p + 1 : null]);
    } else {
      for (let p = 1; p <= n; p += 2) out.push([p, p + 1 <= n ? p + 1 : null]);
    }
    return out;
  }
  function spreadOfPage(p) { return spreads().findIndex(s => s.includes(p)); }

  /* ---------- flip view ---------- */
  let pageW = 200, pageH = 300;
  function layoutBook() {
    const wrap = $('bookWrap').getBoundingClientRect();
    const maxW = Math.max(60, (wrap.width - 2) / 2), maxH = Math.max(120, wrap.height);
    pageW = Math.floor(Math.min(maxW, maxH * state.aspect));
    pageH = Math.floor(pageW / state.aspect);
    for (const id of ['slotL', 'slotR']) { $(id).style.width = pageW + 'px'; $(id).style.height = pageH + 'px'; }
    $('labels').style.width = (pageW * 2) + 'px';
  }
  async function fillSlot(slot, n) {
    slot.querySelectorAll('canvas, .blank').forEach(e => e.remove());
    if (!n) {
      slot.classList.remove('filled');
      const b = document.createElement('div'); b.className = 'blank';
      b.textContent = state.coverAlone && slot.id === 'slotL' && state.spread === 0 ? 'inside of the cover' : 'no page';
      slot.prepend(b); return;
    }
    slot.classList.add('filled');
    const c = copyCanvas(await renderPage(n, pageW));
    slot.prepend(c);
  }
  function setLabels([l, r]) {
    const lab = (n, side) => `<span style="width:${pageW}px">${n ? 'p. ' + n : '&nbsp;'}<small>${n ? side : ''}</small></span>`;
    $('labels').innerHTML = lab(l, 'left · even') + lab(r, 'right · odd');
    const s = spreads();
    $('where').textContent = `${state.spread + 1} / ${s.length}`;
    $('prev').disabled = state.spread === 0; $('next').disabled = state.spread >= s.length - 1;
  }
  async function showSpread(i) {
    const s = spreads(); if (!s.length) return;
    state.spread = Math.max(0, Math.min(i, s.length - 1));
    const [l, r] = s[state.spread];
    await Promise.all([fillSlot($('slotL'), l), fillSlot($('slotR'), r)]);
    setLabels(s[state.spread]);
    prefetch();
  }
  function prefetch() {
    const s = spreads();
    for (const k of [state.spread + 1, state.spread - 1]) if (s[k]) s[k].forEach(n => n && renderPage(n, pageW));
  }
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  async function turn(dir) {
    const s = spreads(); const to = state.spread + dir;
    if (state.busy || to < 0 || to >= s.length) return;
    if (reduced()) return showSpread(to);
    state.busy = true;
    const [cl, cr] = s[state.spread], [nl, nr] = s[to];
    const book = $('book');
    const leaf = document.createElement('div'); leaf.className = 'leaf';
    leaf.style.width = pageW + 'px'; leaf.style.height = pageH + 'px';
    const front = document.createElement('div'); front.className = 'face front';
    const back = document.createElement('div'); back.className = 'face back';
    const frontN = dir > 0 ? cr : cl, backN = dir > 0 ? nl : nr;
    if (frontN) front.appendChild(copyCanvas(await renderPage(frontN, pageW))); else front.style.background = 'transparent';
    if (backN) back.appendChild(copyCanvas(await renderPage(backN, pageW))); else back.style.background = 'transparent', back.style.boxShadow = 'none';
    if (!frontN) front.style.boxShadow = 'none';
    leaf.append(front, back);
    if (dir > 0) { leaf.style.left = pageW + 'px'; leaf.style.transformOrigin = 'left center'; await fillSlot($('slotR'), nr); }
    else { leaf.style.left = '0px'; leaf.style.transformOrigin = 'right center'; await fillSlot($('slotL'), nl); }
    book.appendChild(leaf);
    leaf.getBoundingClientRect();
    leaf.style.transform = `rotateY(${dir > 0 ? -180 : 180}deg)`;
    const done = async () => { state.spread = to; await (dir > 0 ? fillSlot($('slotL'), nl) : fillSlot($('slotR'), nr)); leaf.remove(); setLabels(s[to]); state.busy = false; prefetch(); };
    let finished = false;
    leaf.addEventListener('transitionend', () => { if (!finished) { finished = true; done(); } }, { once: true });
    setTimeout(() => { if (!finished) { finished = true; done(); } }, 900);
  }

  /* ---------- grid views ---------- */
  let io;
  function thumbObserver() {
    if (io) io.disconnect();
    io = new IntersectionObserver(entries => {
      for (const e of entries) if (e.isIntersecting) {
        const el = e.target, n = +el.dataset.page; io.unobserve(el);
        const w = el.getBoundingClientRect().width || 100;
        renderPage(n, w).then(c => { el.prepend(copyCanvas(c)); });
      }
    }, { root: null, rootMargin: '300px' });
    return io;
  }
  function thumb(n, side) {
    const d = document.createElement('div'); d.className = 'thumb ' + side + (n ? ' filled' : '');
    if (n) { d.dataset.page = n; const pn = document.createElement('span'); pn.className = 'pn'; pn.textContent = n; d.appendChild(pn); }
    return d;
  }
  function buildSpreads() {
    const g = $('spreadsGrid'); g.innerHTML = ''; g.style.setProperty('--ar', state.aspect);
    const obs = thumbObserver();
    spreads().forEach(([l, r], i) => {
      const b = document.createElement('button'); b.className = 'card';
      b.setAttribute('aria-label', `Open spread ${i + 1}`);
      const pair = document.createElement('div'); pair.className = 'pair';
      const tl = thumb(l, 'l'), tr = thumb(r, 'r'); pair.append(tl, tr);
      const cap = document.createElement('div'); cap.className = 'cap';
      cap.innerHTML = `<span>${l && r ? `pp. ${l}–${r}` : `p. ${l || r}`}</span><em>spread ${i + 1}</em>`;
      b.append(pair, cap); g.appendChild(b);
      [tl, tr].forEach(t => t.dataset.page && obs.observe(t));
      b.addEventListener('click', () => { setView('flip'); showSpread(i); });
    });
  }
  function buildSheets() {
    const g = $('sheetsGrid'); g.innerHTML = ''; g.style.setProperty('--ar', state.aspect);
    const obs = thumbObserver();
    for (let p = 1, k = 1; p <= state.pages; p += 2, k++) {
      const back = p + 1 <= state.pages ? p + 1 : null;
      const b = document.createElement('button'); b.className = 'card';
      b.setAttribute('aria-label', `Sheet ${k}: front page ${p}${back ? ', back page ' + back : ''}`);
      const pair = document.createElement('div'); pair.className = 'pair';
      const tf = thumb(p, 'l'), tb = thumb(back, 'r'); pair.append(tf, tb);
      const cap = document.createElement('div'); cap.className = 'cap';
      cap.innerHTML = `<span class="sheet-tag">Sheet ${k}</span><em>front ${p} · back ${back || 'blank'}</em>`;
      b.append(pair, cap); g.appendChild(b);
      [tf, tb].forEach(t => t.dataset.page && obs.observe(t));
      b.addEventListener('click', () => { setView('flip'); showSpread(spreadOfPage(p)); });
    }
  }

  /* ---------- views ---------- */
  function setView(v) {
    state.view = v;
    $('flipView').hidden = v !== 'flip'; $('spreadsView').hidden = v !== 'spreads'; $('sheetsView').hidden = v !== 'sheets';
    $('vFlip').setAttribute('aria-pressed', v === 'flip'); $('vSpreads').setAttribute('aria-pressed', v === 'spreads'); $('vSheets').setAttribute('aria-pressed', v === 'sheets');
    if (v === 'flip') { layoutBook(); showSpread(state.spread); }
    if (v === 'spreads') buildSpreads();
    if (v === 'sheets') buildSheets();
  }

  /* ---------- loading ---------- */
  function notice(msg, err = false, ms = 4200) {
    const n = $('notice'); n.textContent = msg; n.classList.toggle('err', err); n.hidden = false;
    clearTimeout(notice.t); notice.t = setTimeout(() => n.hidden = true, ms);
  }
  async function loadFile(file) {
    if (!file) return;
    if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { notice('That file is not a PDF. Choose a .pdf file.', true); return; }
    if (!pdfjs) { notice('The PDF reader could not load. Check your internet connection and reload the page.', true, 7000); return; }
    notice('Opening ' + file.name + '…', false, 60000);
    try {
      const data = new Uint8Array(await file.arrayBuffer());
      const doc = await pdfjs.getDocument({ data }).promise;
      const p1 = await doc.getPage(1); const vp = p1.getViewport({ scale: 1 });
      cache.clear();
      Object.assign(state, { src: doc, pages: doc.numPages, aspect: vp.width / vp.height, spread: 0, name: file.name });
      $('fileName').textContent = `${file.name} · ${doc.numPages} pages`;
      $('goto').max = doc.numPages;
      setView(state.view);
      notice(doc.numPages % 2 ? `${doc.numPages} pages. Odd count: the last sheet has a blank back.` : `${doc.numPages} pages loaded. Nothing was uploaded; it stays on this device.`);
    } catch (e) {
      notice('Could not read this PDF. It may be damaged or password-protected.', true, 7000);
    }
  }

  /* ---------- events ---------- */
  $('pick').addEventListener('change', e => loadFile(e.target.files[0]));
  $('vFlip').addEventListener('click', () => setView('flip'));
  $('vSpreads').addEventListener('click', () => setView('spreads'));
  $('vSheets').addEventListener('click', () => setView('sheets'));
  $('coverAlone').addEventListener('change', e => {
    const cur = (spreads()[state.spread] || []).find(Boolean) || 1;
    state.coverAlone = e.target.checked; state.spread = Math.max(0, spreadOfPage(cur)); setView(state.view);
  });
  $('prev').addEventListener('click', () => turn(-1)); $('next').addEventListener('click', () => turn(1));
  $('hitPrev').addEventListener('click', () => turn(-1)); $('hitNext').addEventListener('click', () => turn(1));
  $('goto').addEventListener('change', e => {
    const p = Math.round(+e.target.value);
    if (p >= 1 && p <= state.pages) { showSpread(spreadOfPage(p)); } else notice(`Pick a page from 1 to ${state.pages}.`, true);
  });
  document.addEventListener('keydown', e => {
    if (state.view !== 'flip' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); turn(1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); turn(-1); }
    if (e.key === 'Home') showSpread(0);
    if (e.key === 'End') showSpread(spreads().length - 1);
  });
  let tx = null;
  $('book').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  $('book').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) turn(dx < 0 ? 1 : -1); tx = null; });
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; $('drop').hidden = false; } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('drop').hidden = true; });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('drop').hidden = true; loadFile(e.dataTransfer.files[0]); });
  let rT; new ResizeObserver(() => { clearTimeout(rT); rT = setTimeout(() => { if (state.view === 'flip') { layoutBook(); showSpread(state.spread); } }, 120); }).observe($('bookWrap'));

  /* ---------- start with the sample ---------- */
  Object.assign(state, { src: sample, pages: sample.pages, aspect: sample.aspect });
  $('goto').max = sample.pages;
  const start = () => { layoutBook(); showSpread(0); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
})();
</script>

</body>
</html>
